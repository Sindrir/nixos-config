[plugin]
prepend_previewers = [
  { url = "*.mdx", run = 'piper -- bat -p --color=always -l md --theme="$([ "$t" = light ] && echo GitHub || echo Dracula)" "$1"' },
  { url = "*.jp2", run = "jp2" },
  { url = "*.jpx", run = "jp2" },
  { url = "*.j2k", run = "jp2" },
  { mime = "image/jp2",      run = "jp2" },
  { mime = "image/jpeg2000", run = "jp2" },
  { mime = "image/jpx",      run = "jp2" },
]
prepend_preloaders = [
  { url = "*.jp2", run = "jp2" },
  { url = "*.jpx", run = "jp2" },
  { url = "*.j2k", run = "jp2" },
  { mime = "image/jp2",      run = "jp2" },
  { mime = "image/jpeg2000", run = "jp2" },
  { mime = "image/jpx",      run = "jp2" },
]

[preview]
# default 600x900 caps image previews (and zoom.yazi) well below the pane size
max_width  = 2000
max_height = 2000
